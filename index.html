<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG キャラクターステータス ダイスローラー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">
<h1 class="text-2xl font-bold mt-4 mb-1 text-red-300">🎲 RPGキャラクター ステータスローラー</h1>
<p class="text-gray-400 mb-4 text-sm">D&D風ステータス（STR/DEX/CON/INT/WIS/CHA）をダイスで生成</p>

<div class="flex gap-3 mb-4 flex-wrap justify-center">
  <label class="text-sm">生成方式:
    <select id="method" class="bg-gray-700 rounded px-2 py-1 ml-1">
      <option value="4d6dl">4d6 ドロップ最低（推奨）</option>
      <option value="3d6">3d6 サム</option>
      <option value="pointbuy">ポイントバイ（27pt）</option>
    </select>
  </label>
  <button id="btnRoll" class="bg-red-700 hover:bg-red-600 px-6 py-2 rounded font-bold">🎲 ロール！</button>
  <button id="btnSave" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">💾 保存</button>
</div>

<div id="pointBuyControls" class="hidden bg-gray-800 rounded-xl p-3 w-full max-w-2xl mb-4 text-sm">
  <div class="text-yellow-300 font-semibold mb-2">ポイント残り: <span id="pointsLeft">27</span> pt</div>
  <div id="pbSliders" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
</div>

<div id="statsPanel" class="w-full max-w-2xl mb-4">
  <div id="statsGrid" class="grid grid-cols-3 md:grid-cols-6 gap-3 mb-4"></div>
  <div id="totalScore" class="text-center text-sm text-gray-400 mb-3"></div>
</div>

<div id="classRec" class="w-full max-w-2xl bg-gray-800 rounded-xl p-4 mb-4">
  <h2 class="font-semibold text-red-300 mb-2">⚔ クラス適性</h2>
  <div id="classGrid" class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm"></div>
</div>

<div id="savedChars" class="w-full max-w-2xl bg-gray-800 rounded-xl p-4 hidden">
  <h2 class="font-semibold text-gray-400 mb-2">💾 保存済みキャラクター</h2>
  <div id="savedList" class="space-y-2 text-sm max-h-40 overflow-y-auto"></div>
  <button id="btnClearSaved" class="mt-2 text-xs text-red-400 hover:text-red-300">クリア</button>
</div>

<script>
const STATS = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
const STAT_NAMES = { STR: '筋力', DEX: '敏捷', CON: '耐久', INT: '知力', WIS: '判断', CHA: '魅力' };
const STAT_COLORS = { STR: '#EF4444', DEX: '#22C55E', CON: '#F97316', INT: '#60A5FA', WIS: '#A78BFA', CHA: '#F472B6' };

const CLASSES = [
  { name: 'バーバリアン', key: 'barbarian', pri: 'STR', sec: 'CON', req: { STR: 13 } },
  { name: 'ウィザード', key: 'wizard', pri: 'INT', sec: 'CON', req: { INT: 13 } },
  { name: 'パラディン', key: 'paladin', pri: 'STR', sec: 'CHA', req: { STR: 13, CHA: 13 } },
  { name: 'レンジャー', key: 'ranger', pri: 'DEX', sec: 'WIS', req: { DEX: 13, WIS: 13 } },
  { name: 'ローグ', key: 'rogue', pri: 'DEX', sec: 'INT', req: { DEX: 13 } },
  { name: 'クレリック', key: 'cleric', pri: 'WIS', sec: 'STR', req: { WIS: 13 } },
  { name: 'バード', key: 'bard', pri: 'CHA', sec: 'DEX', req: { CHA: 13 } },
  { name: 'ドルイド', key: 'druid', pri: 'WIS', sec: 'CON', req: { WIS: 13 } },
];

let currentStats = { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 };
let rollResults = {};

function d6() { return Math.floor(Math.random() * 6) + 1; }
function roll4d6dl() {
  const rolls = [d6(), d6(), d6(), d6()];
  rolls.sort((a,b) => b-a);
  return { value: rolls[0]+rolls[1]+rolls[2], rolls };
}
function roll3d6() {
  const rolls = [d6(), d6(), d6()];
  return { value: rolls[0]+rolls[1]+rolls[2], rolls };
}

function modifier(val) {
  const m = Math.floor((val - 10) / 2);
  return (m >= 0 ? '+' : '') + m;
}

function rollAll() {
  const method = document.getElementById('method').value;
  if (method === 'pointbuy') return;
  rollResults = {};
  STATS.forEach(s => {
    rollResults[s] = method === '4d6dl' ? roll4d6dl() : roll3d6();
    currentStats[s] = rollResults[s].value;
  });
  renderStats();
  renderClasses();
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  let total = 0;
  STATS.forEach(s => {
    const v = currentStats[s];
    total += v;
    const card = document.createElement('div');
    card.className = 'bg-gray-800 rounded-xl p-3 text-center border-b-4';
    card.style.borderBottomColor = STAT_COLORS[s];

    const nameEl = document.createElement('div');
    nameEl.className = 'text-xs font-semibold text-gray-400';
    nameEl.textContent = s + ' ' + STAT_NAMES[s];

    const valEl = document.createElement('div');
    valEl.className = 'text-3xl font-bold my-1';
    valEl.style.color = STAT_COLORS[s];
    valEl.textContent = v;

    const modEl = document.createElement('div');
    modEl.className = 'text-sm text-gray-300';
    modEl.textContent = modifier(v);

    if (rollResults[s]) {
      const rollEl = document.createElement('div');
      rollEl.className = 'text-xs text-gray-500 mt-1';
      rollEl.textContent = '[' + rollResults[s].rolls.join(',') + ']';
      card.appendChild(nameEl);
      card.appendChild(valEl);
      card.appendChild(modEl);
      card.appendChild(rollEl);
    } else {
      card.appendChild(nameEl);
      card.appendChild(valEl);
      card.appendChild(modEl);
    }

    grid.appendChild(card);
  });
  document.getElementById('totalScore').textContent = '合計: ' + total + ' / 平均: ' + (total/6).toFixed(1);
}

function renderClasses() {
  const grid = document.getElementById('classGrid');
  grid.innerHTML = '';
  CLASSES.forEach(cls => {
    const eligible = Object.entries(cls.req).every(([stat, val]) => currentStats[stat] >= val);
    const priMod = parseInt(modifier(currentStats[cls.pri]));
    const div = document.createElement('div');
    div.className = 'rounded p-2 ' + (eligible ? 'bg-green-900 border border-green-600' : 'bg-gray-700 opacity-60');

    const name = document.createElement('div');
    name.className = 'font-semibold ' + (eligible ? 'text-green-300' : 'text-gray-400');
    name.textContent = (eligible ? '✅' : '❌') + ' ' + cls.name;

    const detail = document.createElement('div');
    detail.className = 'text-xs text-gray-400 mt-0.5';
    detail.textContent = '主: ' + cls.pri + '(' + modifier(currentStats[cls.pri]) + ') 副: ' + cls.sec;

    div.appendChild(name);
    div.appendChild(detail);
    grid.appendChild(div);
  });
}

// Point buy
const PB_COSTS = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
let pbValues = { STR:10, DEX:10, CON:10, INT:10, WIS:10, CHA:10 };

function renderPointBuy() {
  const container = document.getElementById('pbSliders');
  container.innerHTML = '';
  STATS.forEach(s => {
    const div = document.createElement('div');
    div.className = 'bg-gray-700 rounded p-2';
    const label = document.createElement('div');
    label.className = 'text-xs font-semibold mb-1';
    label.style.color = STAT_COLORS[s];
    label.textContent = s + ' ' + STAT_NAMES[s];

    const row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    const dec = document.createElement('button');
    dec.className = 'bg-gray-600 px-2 py-0.5 rounded';
    dec.textContent = '-';
    const val = document.createElement('span');
    val.className = 'font-bold text-lg w-6 text-center';
    val.textContent = pbValues[s];
    const inc = document.createElement('button');
    inc.className = 'bg-gray-600 px-2 py-0.5 rounded';
    inc.textContent = '+';
    const mod = document.createElement('span');
    mod.className = 'text-xs text-gray-400';
    mod.textContent = modifier(pbValues[s]);

    const updatePB = (delta) => {
      const newVal = pbValues[s] + delta;
      if (newVal < 8 || newVal > 15) return;
      const newCost = PB_COSTS[newVal];
      const oldCost = PB_COSTS[pbValues[s]];
      const used = Object.entries(pbValues).reduce((acc, [k,v]) => acc + PB_COSTS[v], 0);
      const remaining = 27 - used + oldCost - newCost;
      if (remaining < 0) return;
      pbValues[s] = newVal;
      val.textContent = newVal;
      mod.textContent = modifier(newVal);
      document.getElementById('pointsLeft').textContent = remaining;
      currentStats = {...pbValues};
      renderStats();
      renderClasses();
    };

    dec.addEventListener('click', () => updatePB(-1));
    inc.addEventListener('click', () => updatePB(1));

    row.appendChild(dec);
    row.appendChild(val);
    row.appendChild(inc);
    row.appendChild(mod);
    div.appendChild(label);
    div.appendChild(row);
    container.appendChild(div);
  });
}

document.getElementById('method').addEventListener('change', () => {
  const isPB = document.getElementById('method').value === 'pointbuy';
  document.getElementById('pointBuyControls').classList.toggle('hidden', !isPB);
  if (isPB) {
    pbValues = { STR:10, DEX:10, CON:10, INT:10, WIS:10, CHA:10 };
    document.getElementById('pointsLeft').textContent = 27;
    renderPointBuy();
    currentStats = {...pbValues};
    renderStats();
    renderClasses();
  }
});

document.getElementById('btnRoll').addEventListener('click', rollAll);

document.getElementById('btnSave').addEventListener('click', () => {
  try {
    const saved = JSON.parse(localStorage.getItem('rpg_chars') || '[]');
    saved.push({ stats: {...currentStats}, time: new Date().toLocaleString('ja-JP'), method: document.getElementById('method').value });
    if (saved.length > 10) saved.shift();
    localStorage.setItem('rpg_chars', JSON.stringify(saved));
    renderSaved();
    document.getElementById('savedChars').classList.remove('hidden');
  } catch(e) {}
});

function renderSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem('rpg_chars') || '[]');
    const list = document.getElementById('savedList');
    list.innerHTML = '';
    saved.slice().reverse().forEach(c => {
      const div = document.createElement('div');
      div.className = 'bg-gray-700 rounded p-2';
      const header = document.createElement('div');
      header.className = 'text-xs text-gray-400 mb-1';
      header.textContent = c.time + ' [' + c.method + ']';
      const stats = document.createElement('div');
      stats.className = 'font-mono text-xs text-gray-300';
      stats.textContent = STATS.map(s => s + ':' + c.stats[s]).join(' ');
      div.appendChild(header);
      div.appendChild(stats);
      list.appendChild(div);
    });
  } catch(e) {}
}

document.getElementById('btnClearSaved').addEventListener('click', () => {
  try { localStorage.removeItem('rpg_chars'); } catch(e) {}
  document.getElementById('savedList').innerHTML = '';
});

rollAll();
</script>
</body>
</html>
